<!DOCTYPE html>
<html>
<head>

<title>Smart Manufacturing & IS4.0</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;

body{

background:linear-gradient(135deg,#0b1f33,#173b61);
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.container{
max-width:900px;
padding:40px;
}

h1{
font-size:60px;
margin-bottom:20px;
}

.subtitle{
font-size:24px;
margin-bottom:50px;
opacity:.9;
}

.stats{

justify-content:center;

}

.stat{
font-size:28px;
}

.stat span{

font-size:18px;

border:none;
